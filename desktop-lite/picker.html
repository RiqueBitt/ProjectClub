<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Transmitir</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2B2D31; color: #F2F3F5; font: 14px/1.4 "Segoe UI", Tahoma, Arial, sans-serif; }
  body { display: flex; flex-direction: column; border: 1px solid #1E1F22; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; -webkit-app-region: drag; }
  h1 { margin: 0; font-size: 17px; }
  .tabs { display: flex; gap: 6px; padding: 0 16px 10px; }
  .tabs button { padding: 7px 12px; border: 0; border-radius: 8px; background: #383A40; color: #DBDEE1; font: inherit; cursor: pointer; }
  .tabs button.on { background: #4C9FFF; color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 0 16px 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
  .it { padding: 6px; border: 2px solid transparent; border-radius: 10px; background: #1E1F22; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .it:hover { border-color: #4E5058; }
  .it.sel { border-color: #4C9FFF; }
  .it img, .it .ph { display: block; width: 100%; height: 96px; object-fit: contain; border-radius: 6px; background: #111214; }
  .it span { display: block; margin-top: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12.5px; color: #B5BAC1; }
  .empty { grid-column: 1 / -1; color: #949BA4; padding: 30px 0; text-align: center; }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; background: #232428; }
  footer button { padding: 9px 18px; border: 0; border-radius: 8px; font: 600 14px "Segoe UI", Tahoma, Arial, sans-serif; cursor: pointer; }
  #cancel { background: #4E5058; color: #fff; }
  #go { background: #4C9FFF; color: #fff; }
  #go:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><h1>O que você quer transmitir?</h1></header>
<div class="tabs"><button id="t-screen" class="on" type="button">Telas</button><button id="t-win" type="button">Janelas</button></div>
<main id="grid"><p class="empty">Carregando…</p></main>
<footer><button id="cancel" type="button">Cancelar</button><button id="go" type="button" disabled>Transmitir</button></footer>
<script>
  var all = [], tab = 'screen', chosen = null;
  var grid = document.getElementById('grid'), go = document.getElementById('go');
  function render() {
    grid.innerHTML = '';
    var items = all.filter(function (s) { return tab === 'screen' ? s.screen : !s.screen; });
    if (!items.length) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = tab === 'screen' ? 'Nenhuma tela encontrada.' : 'Nenhuma janela aberta.'; grid.appendChild(p); return; }
    items.forEach(function (s, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'it' + (chosen === s.id ? ' sel' : '');
      var pic;
      if (s.thumb) { pic = document.createElement('img'); pic.src = s.thumb; pic.alt = ''; } else { pic = document.createElement('div'); pic.className = 'ph'; }
      var name = document.createElement('span');
      name.textContent = s.screen && items.length > 1 ? 'Tela ' + (i + 1) : s.screen ? 'Tela inteira' : s.name;
      b.appendChild(pic); b.appendChild(name);
      b.onclick = function () { chosen = s.id; go.disabled = false; render(); };
      b.ondblclick = function () { window.liteScreenPicker.choose(s.id); };
      grid.appendChild(b);
    });
  }
  function setTab(t) { tab = t; document.getElementById('t-screen').className = t === 'screen' ? 'on' : ''; document.getElementById('t-win').className = t === 'win' ? 'on' : ''; render(); }
  document.getElementById('t-screen').onclick = function () { setTab('screen'); };
  document.getElementById('t-win').onclick = function () { setTab('win'); };
  document.getElementById('cancel').onclick = function () { window.liteScreenPicker.choose(null); };
  go.onclick = function () { if (chosen) window.liteScreenPicker.choose(chosen); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.liteScreenPicker.choose(null); });
  window.liteScreenPicker.onList(function (list) { all = list || []; render(); });
</script>
</body>
</html>
