[package]
name = "pc-server"
version = "0.1.0"
description = "Servidor do Project Club em Rust (fase 1: gateway na frente do Node)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ring = "0.17"
ciborium = "0.2"
unicode-normalization = "0.1"
chrono-tz = { version = "0.10", default-features = false, features = ["case-insensitive"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["set-header", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager", "disable-client-setinfo", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
url = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
subtle = "2"
bcrypt = "0.17"
cookie = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "chrono", "rustls-tls", "ring", "tls12", "tracing"] }
qrcode = { version = "0.14", default-features = false }
png = "0.17"
regex = "1"

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
rqrr = "0.8"
