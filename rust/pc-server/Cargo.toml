[package]
name = "pc-server"
version = "0.1.0"
description = "Servidor do Project Club em Rust (fase 1: gateway na frente do Node)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
