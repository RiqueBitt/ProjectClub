<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini-Jogo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a2347; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage, #stage ruffle-player, #stage ruffle-object { display: block; width: 100%; height: 100%; }
  html, body { overscroll-behavior: none; -webkit-touch-callout: none; }
  #tap-hint { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff; font: 700 15px/1.2 system-ui, sans-serif; pointer-events: none; white-space: nowrap; animation: tap-pulse 1.6s ease-in-out infinite; transition: opacity .25s; }
  #tap-hint.is-gone { opacity: 0; animation: none; }
  @keyframes tap-pulse { 50% { transform: translateX(-50%) scale(1.06); } }
  #err { display: none; position: absolute; inset: 0; color: #ddd; font: 600 15px/1.5 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
</style>
<script src="/ruffle/ruffle.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="err">Não foi possível abrir este jogo.</div>
<script src="player.js?v=2"></script>
</body>
</html>
