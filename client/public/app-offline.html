<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Project Club · Sem conexão</title>
<!--
  Página de erro do app Android (server.errorPath em capacitor.config.json).
  Vai DENTRO do .apk: o app mostra ela quando não consegue abrir o site
  (sem internet, servidor reiniciando). Não tem acesso aos plugins nativos,
  por isso é só HTML puro. Tenta de novo sozinha quando a internet volta.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111318; color: #e8e9ee; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; text-align: center; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: #a6a9b6; max-width: 340px; }
  button { margin-top: 8px; border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 600; background: #5865f2; color: #fff; }
  button:disabled { opacity: .6; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f0b232; display: inline-block; margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>Sem conexão com o Project Club</h1>
  <p id="msg"><span class="dot"></span>Verifique sua internet. O app tenta de novo sozinho assim que a conexão voltar.</p>
  <button id="retry" type="button">Tentar de novo</button>
</main>
<script>
  (function () {
    var btn = document.getElementById('retry');
    function go() { btn.disabled = true; btn.textContent = 'Abrindo…'; location.replace('/'); }
    btn.addEventListener('click', go);
    window.addEventListener('online', go);
    // Servidor reiniciando (internet ok): tenta de novo a cada 15 s.
    setInterval(function () { if (navigator.onLine) go(); }, 15000);
  })();
</script>
</body>
</html>
