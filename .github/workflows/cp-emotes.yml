name: Emojis do Club Penguin (wiki)

# Baixa os emoticons originais do Club Penguin da wiki
# (clubpenguinemoticons.fandom.com), grava em
# client/public/emoji-sets/clubpenguin/ + manifest.json e publica o site.
# O servidor cria a coleção de emoji "Club Penguin" sozinho no boot
# (server/src/services/cpEmotes.js). Roda quando este arquivo ou o script
# mudam na main, ou na mão (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp-emotes.yml'
      - '.github/scripts/cp-emotes.mjs'
  workflow_dispatch: {}

concurrency:
  group: cp-emotes
  cancel-in-progress: false

jobs:
  emotes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar os emoticons da wiki
        run: node .github/scripts/cp-emotes.mjs
      - name: Gravar no repositório
        id: commit
        run: |
          git add client/public/emoji-sets/clubpenguin
          if git diff --cached --quiet; then
            echo "Nada mudou nos emoticons."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: emojis do Club Penguin (wiki)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publicar o site com os emojis novos
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
