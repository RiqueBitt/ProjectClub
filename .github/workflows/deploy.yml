name: Deploy na Shard Cloud (pré-compilado)

# A cada push na main: compila o cliente AQUI (máquina do GitHub) e manda o
# projeto inteiro + `client/dist` pronto pra Shard Cloud pela API
# (PUT /apps/{id}/file, zip multipart — a mesma rota do CLI oficial). O
# `scripts/deploy.js` vê o dist pronto, pula o build e só instala as
# dependências de produção. O branch `deploy` continua sendo publicado
# (histórico/rollback e reserva pra outra hospedagem).
#
# Secrets necessários no repositório: SHARDCLOUD_API_KEY (Dashboard →
# Config → Integrações) e SHARDCLOUD_APP_ID (UUID do app).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      SHARDCLOUD_API_KEY: ${{ secrets.SHARDCLOUD_API_KEY }}
      CI_UPDATE_SECRET: ${{ secrets.CI_UPDATE_SECRET }}
      SITE: https://projectclub.shardweb.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Compilar o cliente (+ pré-compressão brotli/gzip)
        run: npm run build -w client
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Conferir o resultado
        run: |
          test -f client/dist/index.html
          echo "dist: $(du -sh client/dist | cut -f1) · arquivos .br: $(find client/dist -name '*.br' | wc -l)"
      - name: Publicar no branch deploy
        run: |
          git config user.name "projectclub-deploy[bot]"
          git config user.email "deploy@users.noreply.github.com"
          # Branch órfão com UM commit (sem histórico — leve pra hospedagem
          # clonar): tudo que está na main + o dist compilado.
          git checkout -q --orphan deploy-tmp
          git add -A
          git add -f client/dist
          git commit -q -m "deploy: ${GITHUB_SHA::7} (pré-compilado pelo CI)"
          git push -f origin deploy-tmp:deploy
          echo "Publicado em deploy a partir de ${GITHUB_SHA::7}"
      # Publicação automática SEM depender da VPS: o próprio app confere no
      # GitHub que este SHA é a ponta do branch deploy, troca o código e se
      # reinicia sozinho (server/src/services/selfDeploy.js). O vigia da VPS
      # fica de reserva e não repete o que o app já fez.
      - name: Atualizar o site (o app se atualiza sozinho)
        id: self
        if: ${{ env.CI_UPDATE_SECRET != '' }}
        run: |
          SHA=$(git rev-parse HEAD)
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X POST "$SITE/api/system/deploy" \
              -H 'Content-Type: application/json' -H "X-CI-Secret: $CI_UPDATE_SECRET" -d "{\"sha\":\"$SHA\"}") || CODE=000
            echo "tentativa $i: HTTP $CODE $(head -c 300 resp.json 2>/dev/null)"
            case "$CODE" in 200|202) break ;; 403) echo "::warning::CI_UPDATE_SECRET não confere com o do site"; exit 0 ;; esac
            sleep 20
          done
          case "$CODE" in 200|202) ;; *) echo "::warning::O site não aceitou a atualização (HTTP $CODE); o vigia da VPS fica de reserva"; exit 0 ;; esac
          # Espera a versão nova responder (até ~12 min: npm ci + prisma push).
          for i in $(seq 1 72); do
            sleep 10
            D=$(curl -s --max-time 8 "$SITE/api/system/deployed" || true)
            H=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$SITE/api/health" || true)
            if grep -q "\"sha\":\"$SHA\"" <<<"$D" && grep -q '"updating":false' <<<"$D" && [ "$H" = 200 ]; then
              echo "Site atualizado e no ar (${SHA::7})"; echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            grep -q '"failed":true' <<<"$D" && { echo "::error::A atualização falhou no servidor ($D)"; exit 1; }
          done
          echo "::error::A versão nova não respondeu a tempo"; exit 1
      # A Shard Cloud é atualizada pelo vigia da VPS projectclub-voz
      # (scripts/deploy-watch.sh), que vê o branch deploy mudar em até 1 min.
      # Se o secret SHARDCLOUD_API_KEY existir, o CI já dispara direto (o zip
      # inteiro passa do limite de upload, então o app baixa sozinho).
      - name: Atualizar a Shard Cloud
        if: ${{ env.SHARDCLOUD_API_KEY != '' && steps.self.outputs.ok != '1' }}
        env:
          APP_ID: ${{ secrets.SHARDCLOUD_APP_ID || 'f9ba88be-b4b5-4c12-aa4a-699e94d41570' }}
        run: |
          SHA=$(git rev-parse HEAD)
          CMD="curl -fsSL https://raw.githubusercontent.com/RiqueBitt/ProjectClub/$SHA/scripts/self-update.sh | sh -s $SHA"
          OUT=$(curl -sN --max-time 900 -X POST -H "Authorization: Bearer $SHARDCLOUD_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$CMD" '{command:$c}')" "https://shardcloud.app/api/apps/$APP_ID/exec")
          echo "$OUT" | tail -c 1500
          grep -q "DEPLOY-OK $SHA" <<<"$OUT" || { echo "::error::A atualização na Shard Cloud falhou"; exit 1; }
          curl -sS -X POST -H "Authorization: Bearer $SHARDCLOUD_API_KEY" -H 'Content-Type: application/json' \
            -d '{"status":"restart"}' "https://shardcloud.app/api/apps/$APP_ID/status"
          echo "Shard Cloud atualizada (${SHA::7})"
