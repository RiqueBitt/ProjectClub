name: Fontes Pixels Galore (DaFont)

# Baixa as fontes da coleção "Pixels Galore" da Loja no DaFont, grava em
# client/public/fonts/pixels-galore/ + manifest.json e publica o site. O
# servidor cria a coleção e os itens da Loja sozinho no boot
# (server/src/services/pixelsGalore.js). Roda quando este arquivo muda na
# main, ou na mão (Actions → Run workflow).
#
# Licenças (conferidas em nov/2026):
#   Minecraft — Craftron Gaming, "100% grátis" no DaFont.
#   Kiwi Soda — jeti (fontenddev.com), CC BY 4.0: uso livre, dando crédito
#               (o crédito vai na descrição do item na Loja).
#   (Daydream ficou de fora: a versão do DaFont é só pra uso pessoal.)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixel-fonts.yml'
  workflow_dispatch: {}

concurrency:
  group: pixel-fonts
  cancel-in-progress: false

jobs:
  fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Baixar as fontes do DaFont
        run: |
          set -euo pipefail
          OUT=client/public/fonts/pixels-galore
          mkdir -p "$OUT"
          TMP=$(mktemp -d)
          # chave | slug no DaFont | nome da família
          FONTS="minecraft|minecraft|Minecraft
          kiwi-soda|kiwisoda|Kiwi Soda"
          echo "[" > "$TMP/manifest.json"
          first=1
          while IFS='|' read -r key slug family; do
            key=$(echo "$key" | xargs)
            [ -n "$key" ] || continue
            mkdir -p "$TMP/$key"
            curl -fsSL --retry 3 -A "Mozilla/5.0 (ProjectClub CI)" -o "$TMP/$key.zip" "https://dl.dafont.com/dl/?f=$slug"
            unzip -o -q "$TMP/$key.zip" -d "$TMP/$key"
            # a primeira .ttf (ou .otf) do pacote
            src=$(find "$TMP/$key" -type f \( -iname '*.ttf' -o -iname '*.otf' \) | sort | head -n1)
            [ -n "$src" ] || { echo "sem arquivo de fonte em $slug"; exit 1; }
            ext=$(echo "${src##*.}" | tr 'A-Z' 'a-z')
            cp "$src" "$OUT/$key.$ext"
            # texto de licença/leia-me do pacote, se vier
            lic=$(find "$TMP/$key" -type f \( -iname '*.txt' -o -iname '*licen*' \) | head -n1 || true)
            [ -n "$lic" ] && cp "$lic" "$OUT/$key-LEIA-ME.txt" || true
            [ $first -eq 1 ] || echo "," >> "$TMP/manifest.json"
            first=0
            printf '  {"key": "%s", "family": "%s", "file": "%s.%s"}' "$key" "$family" "$key" "$ext" >> "$TMP/manifest.json"
          done <<< "$FONTS"
          echo "" >> "$TMP/manifest.json"
          echo "]" >> "$TMP/manifest.json"
          cp "$TMP/manifest.json" "$OUT/manifest.json"
          cat "$OUT/manifest.json"
          ls -la "$OUT"
      - name: Gravar no repositório
        id: commit
        run: |
          git add client/public/fonts/pixels-galore
          if git diff --cached --quiet; then
            echo "Nada mudou nas fontes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: fontes Pixels Galore (DaFont)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publicar o site com as fontes novas
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
