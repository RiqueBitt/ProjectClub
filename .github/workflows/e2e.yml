name: Testes de tela

# Abre as páginas principais do site (Início, Feeds, Social, Progresso,
# Suporte, Apps, chat e Configurações) no PC e no celular, com a API
# simulada, a cada push na main e em cada Pull Request. Se alguma tela
# quebrar (erro de JavaScript, "Algo deu errado", layout vazando), o
# check fica vermelho e o relatório com prints fica nos artefatos.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
  workflow_dispatch: {}

# Cancela a rodada anterior do mesmo PR/ramo quando chega um push novo.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Os testes são divididos em 4 máquinas que rodam ao mesmo tempo.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Compilar o site
        run: npm run build -w client
      - name: Versão do Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: client
      - name: Cache do navegador
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ steps.pw.outputs.v }}
      - name: Instalar o navegador
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Dependências do sistema do navegador
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: client
      - name: Rodar os testes de tela (parte ${{ matrix.shard }} de 4)
        run: npm run test:e2e -w client -- --shard=${{ matrix.shard }}/4
      - name: Anotar os testes que falharam
        if: failure()
        run: |
          node -e '
            try {
              const r = require("./client/test-results/report.json");
              const out = [];
              const walk = (s) => { (s.suites||[]).forEach(walk); (s.specs||[]).forEach((sp)=>{ if(!sp.ok) out.push((sp.tests?.[0]?.projectName||"")+" › "+sp.title); }); };
              (r.suites||[]).forEach(walk);
              console.log("FALHAS:\n"+(out.join("\n")||"(nenhuma no json)"));
              require("fs").writeFileSync("falhas.txt", out.join("\n")+"\n");
            } catch(e){ console.log("sem report.json:", e.message); require("fs").writeFileSync("falhas.txt","sem report.json: "+e.message+"\n"); }
          '
          cat falhas.txt
          mkdir -p /tmp/cl && cp falhas.txt /tmp/cl/falhas-${{ matrix.shard }}.txt && cd /tmp/cl
          git init -q -b ci-e2e && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "falhas parte ${{ matrix.shard }} run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-e2e || true
      - name: Guardar relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-de-tela-${{ matrix.shard }}
          path: client/playwright-report
          retention-days: 7
