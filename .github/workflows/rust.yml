name: Rust (reescrita)

on:
  push:
    paths: ['rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    # MySQL de verdade pros testes de banco (mesmo motor da produção)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: teste
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pteste" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      PC_TEST_DATABASE_URL: mysql://root:teste@127.0.0.1:3306
      PC_TEST_REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Binário Linux (estático, musl) pra testar no servidor de verdade:
  # vai pra pré-versão "rust-dev" (não é o app, não vai pro ar sozinho).
  binario:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/rust'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: musl
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Publicar na pré-versão rust-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/x86_64-unknown-linux-musl/release/pc-server pc-server-linux-x64
          sha256sum pc-server-linux-x64 > pc-server-linux-x64.sha256
          gh release view rust-dev >/dev/null 2>&1 || gh release create rust-dev --prerelease --target rust \
            --title "Rust (testes, não usar)" --notes "Binário de teste da reescrita em Rust (branch rust). Não é o app."
          gh release upload rust-dev pc-server-linux-x64 pc-server-linux-x64.sha256 --clobber
