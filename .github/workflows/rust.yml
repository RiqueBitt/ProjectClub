name: Rust (reescrita)

on:
  push:
    paths: ['rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    # MySQL de verdade pros testes de banco (mesmo motor da produção)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: teste
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pteste" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PC_TEST_DATABASE_URL: mysql://root:teste@127.0.0.1:3306
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
