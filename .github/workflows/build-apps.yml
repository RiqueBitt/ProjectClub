name: Build Apps (Windows + Linux + Android)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'client/android/**'
      - 'client/src/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Gerar o instalador .exe
        run: npm run build:win
      - name: Publicar no repositório de downloads
        shell: bash
        run: |
          set -e
          EXE_PATH=$(ls dist/*.exe | head -n 1)
          cp "$EXE_PATH" "$RUNNER_TEMP/ProjectClub-Setup-Windows.exe"
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-download.sh" \
            "$RUNNER_TEMP/ProjectClub-Setup-Windows.exe" \
            "download/ProjectClub-Setup-Windows.exe" \
            "Windows: atualiza instalador (build automático)"
        env:
          DOWNLOADS_REPO_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Gerar o AppImage
        run: npm run build:linux
      - name: Publicar no repositório de downloads
        run: |
          set -e
          APPIMAGE_PATH=$(ls dist/*.AppImage | head -n 1)
          cp "$APPIMAGE_PATH" "$RUNNER_TEMP/ProjectClub-Linux.AppImage"
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-download.sh" \
            "$RUNNER_TEMP/ProjectClub-Linux.AppImage" \
            "download/ProjectClub-Linux.AppImage" \
            "Linux: atualiza AppImage (build automático)"
        env:
          DOWNLOADS_REPO_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # BUG CORRIGIDO: faltava o SDK do Android em si (só o Java estava
      # instalado) — tanto o `cap sync` quanto o Gradle mais adiante
      # precisam dele. Essa action instala as ferramentas de linha de
      # comando + a platform-tools na mesma versão que o projeto usa
      # (ver variables.gradle).
      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependências do client
        working-directory: client
        run: npm install
      - name: Compilar o site (gera client/dist, que o app Android embala)
        working-directory: client
        run: npm run build
      - name: Sincronizar com o projeto Android
        working-directory: client
        run: npx cap sync android
      - name: Garantir que o gradlew é executável
        run: chmod +x client/android/gradlew
      - name: Decodificar a chave de assinatura
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > client/android/app/release.keystore
      - name: Gerar o .apk assinado
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_PATH: app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Publicar no repositório de downloads
        run: |
          set -e
          APK_PATH=$(find client/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "$RUNNER_TEMP/ProjectClub.apk"
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-download.sh" \
            "$RUNNER_TEMP/ProjectClub.apk" \
            "download/ProjectClub.apk" \
            "Android: atualiza APK (build automático)"
        env:
          DOWNLOADS_REPO_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
