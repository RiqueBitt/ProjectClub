# Sobe o servidor de mídia + coturn (STUN/TURN) + Caddy (TLS automático) num
# VPS. Copie .env.example para .env, preencha, e: docker compose up -d
#
# Portas que precisam estar ABERTAS no firewall do VPS:
#   80, 443 TCP            (Caddy: TLS + sinalização wss)
#   3478 UDP+TCP           (coturn STUN/TURN)
#   40000-40999 UDP+TCP    (mediasoup: mídia RTP/ICE)
#   49160-49200 UDP        (coturn: relay)
services:
  media:
    build: .
    restart: unless-stopped
    network_mode: host          # mediasoup precisa das portas UDP direto (sem NAT do docker)
    env_file: .env
    environment:
      MEDIA_PORT: ${MEDIA_PORT:-4443}
      MEDIA_HOST: 127.0.0.1     # só o Caddy (mesma máquina) fala com a sinalização
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.MEDIA_PORT||4443)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --realm=${MEDIA_DOMAIN}
      --external-ip=${MEDIA_PUBLIC_IP}
      --min-port=49160 --max-port=49200
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --fingerprint --no-multicast-peers --no-cli
      --no-tlsv1 --no-tlsv1_1

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
