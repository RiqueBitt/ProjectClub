<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Praça · Club Penguin (offline)</title>
<style>
  :root { color-scheme: dark; --bg: #0b2a4a; --panel: #111318; --text: #e8e9ee; --muted: #a6a9b6; --accent: #4c9fff; --warn: #f0b232; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--panel); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; display: grid; place-items: center; background: radial-gradient(1200px 600px at 50% 0%, #163a63 0%, var(--panel) 70%); }
  #stage { width: 760px; height: 480px; transform-origin: center; background: var(--bg); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #stage ruffle-player, #stage .praca-player { width: 100% !important; height: 100% !important; display: block; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; background: rgba(11,42,74,.86); backdrop-filter: blur(6px); transition: opacity .25s; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 22px; }
  .overlay p { margin: 0; color: var(--muted); max-width: 420px; }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--warn); }
  .bar { width: min(420px, 80vw); height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #7cc4ff); transition: width .4s; }
  button { border: 0; border-radius: 10px; padding: 11px 26px; font: inherit; font-weight: 700; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: rgba(255,255,255,.1); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .spin { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hud { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .hud b { color: var(--text); }
  .pill { padding: 2px 8px; border-radius: 99px; background: rgba(240,178,50,.18); color: var(--warn); font-weight: 700; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="stage"></div>
    <div class="overlay" id="overlay">
      <span class="tag">PRAÇA · MODO OFFLINE</span>
      <h1 id="title">Preparando a ilha…</h1>
      <p id="msg">Conferindo os arquivos do jogo neste computador.</p>
      <div class="bar" id="bar" hidden><i id="fill"></i></div>
      <div id="actions"></div>
    </div>
    <div class="hud" id="hud" hidden><span class="pill">OFFLINE</span><span>Pinguim <b id="pname">—</b></span><span>Moedas <b id="pcoins">—</b></span><span id="pparty"></span></div>
  </div>
  <script src="/pc-offline/praca.js"></script>
</body>
</html>
